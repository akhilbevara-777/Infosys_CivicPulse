spring.application.name=civicpulse-backend
server.port=8080

# ─── PostgreSQL (production) ──────────────────────────────────────────────────
# Uncomment these lines and comment out the H2 section below when using PostgreSQL
# spring.datasource.url=jdbc:postgresql://localhost:5432/civicpulse
# spring.datasource.username=postgres
# spring.datasource.password=Splurge@77777
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── H2 In-Memory (development / default) ────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:civicpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads
app.upload.max-size-mb=5

# ─── Static resource serving (uploaded files) ────────────────────────────────
spring.web.resources.static-locations=file:uploads/,classpath:/static/

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.civicpulse=INFO
logging.level.org.springframework.web=WARN
